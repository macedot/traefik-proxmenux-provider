<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- no-referrer: never leak the portal origin to app targets -->
<meta name="referrer" content="no-referrer">
<title>traefik-proxmenux-provider · published services</title>
<style>
  :root{--bg:#14161a;--card:#1e2126;--border:#2a2e34;--text:#e8e8ea;--muted:#9aa0a6;--accent:#58a6ff;--link:#6cb2ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:26px 32px 8px}
  header h1{margin:0;font-size:22px;letter-spacing:.3px}
  header h1 span{color:var(--accent)}
  header p{margin:0;color:var(--muted);font-size:13px}
  header .n{color:var(--accent);font-weight:700}
  #staticgrid,.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  main{padding:0 0 26px} /* sections carry their own horizontal padding */
  .dsec{padding:0 32px 26px}
  .cardtop .ebtn.tgl{flex:none;font-size:14px}
  .dhead{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  .dhead{cursor:pointer;-webkit-user-select:none;user-select:none}
  .dhead .fold{display:inline-block;width:1.1em}
  .dgrid.off{opacity:.45}
  .ddot,.idot{margin-left:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;transition:border-color .15s,transform .15s;-webkit-user-select:none;user-select:none}
  .card.up{box-shadow:inset 3px 0 0 #3fb950}
  .card.down{box-shadow:inset 3px 0 0 #ff6b6b}
  .cardtop{display:flex;align-items:center;min-height:26px;padding-left:36px}
  .card .ebtn.tgl{position:absolute;top:8px;left:10px;font-size:14px}
  .card.editing{border-color:var(--accent);animation:editpulse 1.1s ease-in-out infinite}
  @keyframes editpulse{0%,100%{opacity:1}50%{opacity:.55}}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card a.domain{display:block;font-size:16px;font-weight:600;color:var(--link);text-decoration:none;word-break:break-word}
  .card a.domain:hover{text-decoration:underline}
  .card:focus-visible,a.domain:focus-visible,.ebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
  .card .svc{color:var(--muted);font-size:13px;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .chip{background:#262a30;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  .chip b{color:var(--text);font-weight:600}
  a.chip{color:var(--muted);text-decoration:none}
  a.chip:hover{border-color:var(--accent);color:var(--text)}
  .chip.bad{color:#ff6b6b;border-color:#7a3a3a;background:#2a1a1a}
  .chip.warn{color:#ffb86b;border-color:#7a5c2a;background:#2a2318}
  .ebtn.tgl{margin-left:auto;color:var(--text);font-size:14px;line-height:1}
  .chips .ebtn{font-size:12px}
  .card.dim{opacity:.55}
  .editrow{margin-top:10px}
  .nameinput{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-user-select:text;user-select:text}
  .editactions{display:flex;gap:6px;margin-top:8px}
  .ebtn{background:#262a30;border:1px solid var(--border);border-radius:6px;color:var(--muted);font:12px system-ui,sans-serif;padding:5px 10px;cursor:pointer}
  .ebtn:hover{color:var(--text)}
  .ebtn:disabled,.nameinput:disabled{opacity:.5;cursor:wait}
  .ebtn.save{color:#7ee787;border-color:#2a4a2a}
  footer{padding:0 32px 26px;color:var(--muted);font-size:12px}
  footer a{color:var(--link)}
  .empty{padding:40px 32px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>🧭 traefik-prox<span>menux</span>-provider</h1>
  <p><span class="n" id="n">…</span> published services<br/>updated <span id="updated">…</span> · <span id="authmode"></span></p>
</header>
<section id="static" class="dsec">
  <h2 class="dhead" id="statichead"><span class="fold">▾</span> Infrastructure · <span id="ninfra">0</span><button class="ebtn tgl idot" title=""></button></h2>
  <div id="staticgrid" class="dgrid"></div>
</section>
<section id="customsec" class="dsec">
  <h2 class="dhead" id="customhead"><span class="fold">▾</span> Custom · <span id="ncustom">0</span><button class="ebtn" id="addbtn" title="add a custom entry" style="display:none">＋ add</button></h2>
  <div id="customform" style="display:none;margin:0 0 14px;padding:12px;border:1px solid var(--border);border-radius:10px;display:none;gap:8px;flex-wrap:wrap;align-items:center">
    <input id="cf-name" class="nameinput" placeholder="name (e.g. NAS)" maxlength="63" autocomplete="off" spellcheck="false" style="max-width:160px">
    <input id="cf-ip" class="nameinput" placeholder="192.0.2.10" maxlength="45" autocomplete="off" spellcheck="false" style="max-width:150px">
    <input id="cf-port" class="nameinput" placeholder="port" maxlength="5" inputmode="numeric" autocomplete="off" style="max-width:90px">
    <select id="cf-scheme" class="nameinput" style="max-width:110px"><option value="http">http</option><option value="https">https</option></select>
    <select id="cf-domain" class="nameinput" style="max-width:190px"></select>
    <button class="ebtn" id="cf-add">add</button>
    <button class="ebtn" id="cf-cancel">cancel</button>
  </div>
  <div id="customgrid" class="dgrid"></div>
</section>
<main id="grid"><div class="empty">loading…</div></main>
<footer>generated by traefik-proxmenux-provider <b id="ver">…</b> · <a href="/api/routes">/api/routes</a> · <a href="/healthz">/healthz</a> · double-click a card (or Enter/F2) to rename its URL</footer>
<script>
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
// ISO-ish stamp: yyyy-mm-dd HH:MM:SS +HH:MM (24h, viewer's timezone)
function isoStamp(d){
  const p=(n)=>String(n).padStart(2,"0");
  const off=-d.getTimezoneOffset(),sign=off>=0?"+":"-",a=Math.abs(off);
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "
    +p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())
    +" "+sign+p(Math.floor(a/60))+":" +p(a%60);
}
// waitSync polls /api/routes until pred(routes) holds or ~9s pass, so a
// control keeps its transitional state until the provider republishes.
async function waitSync(pred){
  for(let i=0;i<10;i++){
    await new Promise(r=>setTimeout(r,900));
    try{
      const s=await (await fetch("/api/routes",{cache:"no-store"})).json();
      if(pred(s.routes||[]))return true;
    }catch(e){}
  }
  return false;
}
// click-to-edit: rename the published URL (service name never changes);
// auto-refresh pauses while an edit is open
let EDITING=false;let sDomains=[];
function startEdit(card,x,link){
  if(EDITING)return;EDITING=true;
  card.classList.add("editing"); // pulse until the edit is applied
  const row=document.createElement("div");row.className="editrow";
  const inp=document.createElement("input");inp.className="nameinput";
  inp.value=x.slug;inp.maxLength=63;inp.autocomplete="off";inp.spellcheck=false;
  // domain picker: first configured domain is the default; a per-app pick
  // is stored in overrides and wins over the config default
  const sel=document.createElement("select");sel.className="nameinput";sel.style.marginTop="6px";
  (sDomains||[]).forEach(d=>{
    const o=document.createElement("option");o.value=d;o.textContent="."+d;
    if(d===x.domain)o.selected=true;sel.appendChild(o);
  });
  if((sDomains||[]).length<2)sel.style.display="none";
  // Enter = ok, Esc = cancel — same contract as the name input
  sel.onkeydown=(ev)=>{
    if(ev.key==="Enter"){ev.preventDefault();save.onclick();}
    else if(ev.key==="Escape"){ev.preventDefault();cancel.onclick();}
  };
  // the stable identity: infra uses key ("infra:<slug>"), apps use vmid
  const identBody=()=>({key:x.key||undefined,vmid:x.key?undefined:x.vmid,port:x.key?undefined:x.port,slug:inp.value,domain:sel.value});
  const identFind=(rs)=>rs.find(v=>x.key?v.key===x.key:(v.kind==="app"&&v.vmid===x.vmid&&(!x.port||v.port===x.port)));
  // picking a domain applies immediately: gray + pulse the card until the
  // route is republished under the new domain
  sel.onchange=async()=>{
    if(sel.disabled)return;
    card.classList.add("editing"); // gray + pulse until updated
    sel.disabled=true;save.disabled=true;def.disabled=true;save.textContent="⟳ syncing";
    const r=await fetch("/api/slug",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(identBody())});
    if(!r.ok){const j=await r.json().catch(()=>({}));
      card.classList.remove("editing");sel.disabled=false;save.disabled=false;def.disabled=false;
      save.textContent=j.error||"error";return}
    const slug=inp.value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const want=slug+"."+sel.value;
    await waitSync(rs=>{const rt=identFind(rs);return !!rt&&rt.hostname===want});
    EDITING=false;load();
  };
  row.append(inp,sel);
  const actions=document.createElement("div");actions.className="editactions";
  const save=document.createElement("button");save.className="ebtn save";save.textContent="✓ save";
  const def=document.createElement("button");def.className="ebtn";def.textContent="↺ default";
  const cancel=document.createElement("button");cancel.className="ebtn";cancel.textContent="✕ discard";
  const freeze=(on)=>{inp.disabled=on;sel.disabled=on;def.disabled=on;cancel.disabled=on;};
    save.onclick=async()=>{
    if(save.disabled)return;
    freeze(true);save.disabled=true;save.textContent="⟳ syncing";
    const r=await fetch("/api/slug",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(identBody())});
    if(!r.ok){freeze(false);save.disabled=false;save.textContent=j.error||"error";return}
    // server slugifies; mirror it to detect the republished hostname
    const slug=inp.value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
    const want=slug+"."+sel.value;
    await waitSync(rs=>{const rt=identFind(rs);return !!rt&&rt.hostname===want});
    EDITING=false;load();
  };
  def.onclick=async()=>{
    if(def.disabled)return;
    freeze(true);def.disabled=true;def.textContent="⟳ syncing";
    try{
      await fetch("/api/slug",{method:"DELETE",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(identBody())});
      await waitSync(rs=>{const rt=identFind(rs);return !!rt&&rt.hostname!==x.hostname});
    }catch(e){freeze(false);def.disabled=false;def.textContent="default";return}
    EDITING=false;load();
  };
  cancel.onclick=()=>{EDITING=false;load();};
  inp.onkeydown=(ev)=>{
    if(ev.key==="Enter"){ev.preventDefault();save.onclick();}
    else if(ev.key==="Escape"){ev.preventDefault();cancel.onclick();}
  };
  actions.append(save,def,cancel);
  link.replaceWith(row);
  row.prepend(inp);
  inp.focus();
}
async function load(){
  try{
    const s=await (await fetch("/api/routes",{cache:"no-store"})).json();
    const g=document.getElementById("grid");
    g.innerHTML="";
    // aggregate state of one domain's children:
    // 🟢 all serving · 🔴 none serving · 🟠 something starting/stopping · 🔵 partial
    const domainDot=(d)=>{
      const kids=[];
      viewData.forEach((v)=>{if(v.kind==="app"&&v.domain===d)kids.push(v)});
      for(const k of inflight){
        const v=viewData.get(k);
        if(v&&v.kind==="app"&&v.domain===d)return {t:"🟠",title:"starting/stopping…"};
      }
      const isOff=(s.domains_off||[]).includes(d);
      const serving=kids.filter(k=>k.served).length;
      if(isOff)return {t:"🔴",title:"domain off — click to enable all its apps"};
      if(kids.length&&serving===kids.length)return {t:"🟢",title:"all apps serving — click to switch the domain off"};
      if(serving===0)return {t:"🔴",title:"all stopped — click to enable the domain"};
      return {t:"🔵",title:"partially running ("+serving+"/"+kids.length+")"};
    };
    const refreshDomainDot=(d)=>{
      const ddot=ddots.get(d);
      if(!ddot)return;
      const st=domainDot(d);
      ddot.textContent=st.t;
      ddot.title=st.title;
    };
    const ddots=new Map();
    const views=new Map(); // card key -> element, for in-place patching
    const viewData=new Map(); // card key -> last known route
    const inflight=new Set(); // card keys with a toggle/apply in flight
    const apps=(s.routes||[]).filter(r=>r.kind==="app");
    const makeCard=(x)=>{
      const c=document.createElement("div");c.className="card"+((x.stale||x.disabled)?" dim":"")
        +(x.disabled?"":(x.stale?" down":" up")); // live up/down edge when ON
      const flags=(x.stale?'<span class="chip bad">⚠ stale — '+esc(x.stale_reason||"unreachable")+'</span>':'')
        +(x.disabled?'<span class="chip warn">⏸ disabled</span>':'');
      const link=document.createElement("a");link.className="domain";link.href="https://"+x.hostname+"/";
      link.textContent=x.hostname;
      link.target="_blank";link.rel="noopener noreferrer";
      // the on/off dot lives on the first line, left of the URL
      const top=document.createElement("div");top.className="cardtop";
      let tgl=null;
      if(s.edit_enabled){
        tgl=document.createElement("button");tgl.className="ebtn tgl";
        tgl.title="route status / toggle";
      }
      if(tgl)top.appendChild(tgl);
      top.appendChild(link);
      c.appendChild(top);
      const svc=document.createElement("div");svc.className="svc";svc.textContent=x.app_name;
      c.appendChild(svc);
      if(flags){const fl=document.createElement("div");fl.className="chips";fl.innerHTML=flags;c.appendChild(fl)}
      const ch=document.createElement("div");ch.className="chips";
      ch.innerHTML='<span class="chip">🖥 <b>'+esc(x.guest_name)+'</b></span>'
        +'<a class="chip iplink" href="'+esc(x.scheme||"http")+'://'+esc(x.ip)+':'+esc(x.port)+'/" target="_blank" rel="noopener noreferrer" title="open '+esc(x.scheme||"http")+'://'+esc(x.ip)+':'+esc(x.port)+' directly"><b>'+esc(x.ip)+'</b>:'+esc(x.port)+'</a>';
      if(tgl){
        // status dot: 🟢 serving · 🟠 applying · 🔴 stopped
        const setDot=()=>{
          tgl.textContent=x.disabled?"🔴":(x.stale?"🟠":"🟢");
          tgl.title=x.disabled?"stopped — click to start":"serving — click to stop";
        };
        setDot();
        tgl.onclick=async()=>{
          if(tgl.disabled)return;
          const want=!x.disabled;
          const vkey=x.key||("v"+x.vmid+":"+x.port);
          inflight.add(vkey);refreshDomainDot(x.domain);
          tgl.disabled=true;tgl.textContent="🟠";tgl.title="applying…";
          const r=await fetch("/api/enabled",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({vmid:x.vmid,port:x.port,disabled:!x.disabled})});
          if(!r.ok){const j=await r.json().catch(()=>({}));tgl.disabled=false;tgl.textContent=j.error||"error";
            inflight.delete(vkey);refreshDomainDot(x.domain);return}
          await waitSync(rs=>{const rt=rs.find(v=>v.kind==="app"&&v.vmid===x.vmid&&(!x.port||v.port===x.port));return !!rt&&rt.served===want});
          // patch this card in place instead of reloading the whole page
          try{
            const s2=await (await fetch("/api/routes",{cache:"no-store"})).json();
            const rt=(s2.routes||[]).find(v=>v.kind==="app"&&v.vmid===x.vmid&&(!x.port||v.port===x.port));
            if(rt){const nel=makeCard(rt,s2);const old=views.get(vkey);
              if(old&&old.parentNode)old.replaceWith(nel);views.set(vkey,nel);
              viewData.set(vkey,rt);}
            else load();
          }catch(e){load()}
          inflight.delete(vkey);refreshDomainDot(x.domain);
        };
      }
      c.appendChild(ch);
      if(s.edit_enabled&&!x.stale){
        c.title="double-click (or Enter) to edit the URL name";
        c.tabIndex=0;
        // click-count detection (ev.detail===2) is steadier than the native
        // dblclick event; links and the edit row are exempt
        c.addEventListener("click",(ev)=>{
          if(ev.target.closest("a")||ev.target.closest(".ebtn")||ev.target.closest(".editrow"))return;
          if(ev.detail===2)startEdit(c,x,link);
        });
        // keyboard: Enter/F2 on the focused card edits; keys on children
        // (link, buttons, input) keep their native meaning
        c.addEventListener("keydown",(ev)=>{
          if(ev.target!==c)return;
          if(ev.key==="Enter"||ev.key==="F2"){ev.preventDefault();startEdit(c,x,link);}
        });
      }
      return c;
    };
    // split the apps list per used domain, config order first
    const cfgDomains=s.domains||[];
    const byDomain=new Map();
    apps.forEach(x=>{const d=x.domain||cfgDomains[0]||"apps";if(!byDomain.has(d))byDomain.set(d,[]);byDomain.get(d).push(x);});
    const order=[...cfgDomains.filter(d=>byDomain.has(d)),...[...byDomain.keys()].filter(d=>!cfgDomains.includes(d)).sort()];
    order.forEach(d=>{
      const list=byDomain.get(d);
      const sec=document.createElement("section");sec.className="dsec";
      const h=document.createElement("h2");h.className="dhead";
      const isOff=(s.domains_off||[]).includes(d);
      h.innerHTML='<span class="fold"></span> '+esc(d)+" · "+list.length+(list.length===1?" app":" apps")
        +(s.edit_enabled?'<button class="ebtn tgl ddot" title=""></button>':"");
      const dg=document.createElement("div");dg.className="dgrid"+(isOff?" off":"");
      list.forEach(x=>{const el=makeCard(x);views.set("v"+x.vmid,el);viewData.set("v"+x.vmid,x);dg.appendChild(el);});
      sec.append(h,dg);
      const ddot=h.querySelector(".ddot");
      ddots.set(d,ddot);
      refreshDomainDot(d);
      if(ddot){
        const setD=()=>{ddot.textContent=isOff?"🔴":"🟢";
          ddot.title=isOff?"domain off — click to enable all its apps":"domain on — click to switch the whole domain off";};
        setD();
        ddot.onclick=async(ev)=>{
          ev.stopPropagation(); // dot toggles, header click still folds
          if(ddot.disabled)return;
          ddot.disabled=true;ddot.textContent="🟠";ddot.title="applying…";
          const rr=await fetch("/api/domain",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({domain:d,disabled:!isOff})});
          if(!rr.ok){const j=await rr.json().catch(()=>({}));ddot.disabled=false;ddot.textContent=j.error||"error";return}
          await waitSync(rs=>((rs.domains_off||[]).includes(d))===!isOff);
          load();
        };
      }
      // foldable: click the header; per-domain state survives reloads
      const key="pmp-fold-"+d;let folded=false;
      try{folded=localStorage.getItem(key)==="1"}catch(e){}
      const apply=()=>{dg.style.display=folded?"none":"";
        const f=h.querySelector(".fold");if(f)f.textContent=folded?"▸":"▾";};
      h.title="click to fold/unfold";
      h.onclick=()=>{folded=!folded;try{localStorage.setItem(key,folded?"1":"0")}catch(e){}apply();};
      apply();
      g.appendChild(sec);
    });
    if(apps.length===0)g.innerHTML=""; // no apps: only the infra section shows
    document.getElementById("n").textContent=apps.length;
    document.getElementById("updated").textContent=isoStamp(new Date(s.generated_at));
    document.getElementById("authmode").textContent=s.auth_mode?"monitor auth: "+s.auth_mode:"";
    document.getElementById("ver").textContent=s.version||"dev";
    sDomains=s.domains||[];
    // infrastructure section (toggleable like apps; default from config)
    const sg=document.getElementById("staticgrid");
    sg.innerHTML="";
    const infra=(s.routes||[]).filter(r=>r.kind==="infra"&&!r.stale);
    infra.forEach(r=>{
      const c=document.createElement("div");c.className="card"+(r.disabled?" dim":(r.stale?" down":" up"));
      const chip=r.disabled?'<span class="chip warn">⏸ disabled</span>':"";
      c.innerHTML='<div class="cardtop">'+(s.edit_enabled?'<button class="ebtn tgl" title="route status / toggle"></button>':"")
        +'<a class="domain" target="_blank" rel="noopener noreferrer" href="https://'+esc(r.hostname)+'/">'+esc(r.hostname)+'</a></div>'
        +'<div class="svc">'+esc(r.app_name)+'</div>'
        +'<div class="chips"><span class="chip">🖥 <b>'+esc(r.guest_name)+'</b></span><a class="chip iplink" href="'+esc(r.scheme||"http")+'://'+esc(r.ip)+':'+esc(r.port)+'/" target="_blank" rel="noopener noreferrer" title="open '+esc(r.scheme||"http")+'://'+esc(r.ip)+':'+esc(r.port)+' directly"><b>'+esc(r.ip)+'</b>:'+esc(r.port)+'</a>'+chip
        +'</div>';
      const b=c.querySelector(".ebtn.tgl");
      if(b){
        const setDot=()=>{b.textContent=r.disabled?"🔴":(r.stale?"🟠":"🟢");
          b.title=r.disabled?"stopped — click to start":"serving — click to stop";};
        setDot();
        b.onclick=async()=>{
          if(b.disabled)return;
          const want=!r.disabled;
          b.disabled=true;b.textContent="🟠";b.title="applying…";
          const res=await fetch("/api/enabled",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({key:r.key,disabled:!r.disabled})});
          if(!res.ok){const j=await res.json().catch(()=>({}));b.disabled=false;b.textContent=j.error||"error";return}
          await waitSync(rs=>{const rt=rs.find(v=>v.kind==="infra"&&v.key===r.key);return !!rt&&rt.served===want});
          // infra cards: rebuild just the infra grid (small, keeps alignment)
          load();
        };
      }
      // infra cards are editable like apps (slug + domain); stable key
      if(s.edit_enabled&&!r.stale){
        const link=c.querySelector("a.domain");
        c.title="double-click (or Enter) to edit the URL name";
        c.tabIndex=0;
        c.addEventListener("click",(ev)=>{
          if(ev.target.closest("a")||ev.target.closest(".ebtn")||ev.target.closest(".editrow"))return;
          if(ev.detail===2)startEdit(c,r,link);
        });
        c.addEventListener("keydown",(ev)=>{
          if(ev.target!==c)return;
          if(ev.key==="Enter"||ev.key==="F2"){ev.preventDefault();startEdit(c,r,link);}
        });
      }
      sg.appendChild(c);
      views.set(r.key,c);
    });
    document.getElementById("static").hidden=infra.length===0;
    document.getElementById("ninfra").textContent=infra.length;
    document.getElementById("staticgrid").classList.toggle("off",!!s.infra_off);
    // infra section folds like the domain sections; state persists
    const sh=document.getElementById("statichead"), sg2=document.getElementById("staticgrid");
    const idot=sh.querySelector(".idot");
    if(idot){
      const setI=()=>{idot.textContent=s.infra_off?"🔴":"🟢";
        idot.title=s.infra_off?"infra off — click to enable":"infra on — click to switch all infra off";};
      setI();
      idot.onclick=async(ev)=>{
        ev.stopPropagation();
        if(idot.disabled)return;
        idot.disabled=true;idot.textContent="🟠";idot.title="applying…";
        const rr=await fetch("/api/infra",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({disabled:!s.infra_off})});
        if(!rr.ok){const j=await rr.json().catch(()=>({}));idot.disabled=false;idot.textContent=j.error||"error";return}
        await waitSync(rs=>!!rs.infra_off===!s.infra_off);
        load();
      };
    }
    const fkey="pmp-fold-infra";let ffolded=false;
    try{ffolded=localStorage.getItem(fkey)==="1"}catch(e){}
    const fapply=()=>{sg2.style.display=ffolded?"none":"";
      const f=sh.querySelector(".fold");if(f)f.textContent=ffolded?"▸":"▾";};
    sh.title="click to fold/unfold";
    sh.onclick=()=>{ffolded=!ffolded;try{localStorage.setItem(fkey,ffolded?"1":"0")}catch(e){}fapply();};
    fapply();
    // custom entries section: manually defined routes (the + button),
    // rendered as normal app cards with a delete action
    const custom=(s.routes||[]).filter(r=>r.kind==="custom");
    document.getElementById("customsec").hidden=custom.length===0&&!s.edit_enabled;
    document.getElementById("ncustom").textContent=custom.length;
    const cg=document.getElementById("customgrid");cg.innerHTML="";
    custom.forEach(r=>{
      const c=document.createElement("div");c.className="card"+((r.stale||r.disabled)?" dim":"")+(r.disabled?"":(r.stale?" down":" up"));
      const flags=(r.stale?'<span class="chip bad">⚠ stale — '+esc(r.stale_reason||"unreachable")+'</span>':'')
        +(r.disabled?'<span class="chip warn">⏸ disabled</span>':'');
      c.innerHTML='<div class="cardtop">'+(s.edit_enabled?'<button class="ebtn tgl" title="route status / toggle"></button>':"")
        +'<a class="domain" target="_blank" rel="noopener noreferrer" href="https://'+esc(r.hostname)+'/">'+esc(r.hostname)+'</a></div>'
        +'<div class="svc">'+esc(r.app_name)+'</div>'
        +'<div class="chips">'+flags
        +'<a class="chip iplink" href="'+esc(r.scheme||"http")+'://'+esc(r.ip)+':'+esc(r.port)+'/\" target="_blank" rel="noopener noreferrer" title="open '+esc(r.scheme||"http")+'://'+esc(r.ip)+':'+esc(r.port)+' directly"><b>'+esc(r.ip)+'</b>:'+esc(r.port)+'</a>'
        +(s.edit_enabled?'<button class="ebtn del" title="remove this custom entry">✕</button>':"")
        +'</div>';
      const b=c.querySelector(".ebtn.tgl");
      if(b){
        const setDot=()=>{b.textContent=r.disabled?"🔴":(r.stale?"🟠":"🟢");
          b.title=r.disabled?"stopped — click to start":"serving — click to stop";};
        setDot();
        b.onclick=async()=>{
          if(b.disabled)return;
          const want=!r.disabled;
          b.disabled=true;b.textContent="🟠";b.title="applying…";
          const res=await fetch("/api/enabled",{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({key:r.key,disabled:!r.disabled})});
          if(!res.ok){const j=await res.json().catch(()=>({}));b.disabled=false;b.textContent=j.error||"error";return}
          await waitSync(rs=>{const rt=rs.find(v=>v.kind==="custom"&&v.key===r.key);return !!rt&&rt.served===want});
          load();
        };
      }
      const del=c.querySelector(".ebtn.del");
      if(del){
        del.onclick=async()=>{
          if(del.disabled)return;
          if(!confirm("remove "+r.hostname+"?"))return;
          del.disabled=true;del.textContent="…";
          const res=await fetch("/api/slug",{method:"DELETE",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({key:r.key})});
          if(!res.ok){const j=await res.json().catch(()=>({}));del.disabled=false;del.textContent="✕";del.title=j.error||"error";return}
          await waitSync(rs=>!rs.find(v=>v.key===r.key));
          load();
        };
      }
      if(s.edit_enabled&&!r.stale){
        const link=c.querySelector("a.domain");
        c.title="double-click (or Enter) to edit the URL name";
        c.tabIndex=0;
        c.addEventListener("click",(ev)=>{
          if(ev.target.closest("a")||ev.target.closest(".ebtn")||ev.target.closest(".editrow"))return;
          if(ev.detail===2)startEdit(c,r,link);
        });
        c.addEventListener("keydown",(ev)=>{
          if(ev.target!==c)return;
          if(ev.key==="Enter"||ev.key==="F2"){ev.preventDefault();startEdit(c,r,link);}
        });
      }
      cg.appendChild(c);
      views.set(r.key,c);
    });
    // custom section folds like infra; the + button opens the create form
    const ch2=document.getElementById("customhead"),cg2=document.getElementById("customgrid");
    const ckey="pmp-fold-custom";let cfolded=false;
    try{cfolded=localStorage.getItem(ckey)==="1"}catch(e){}
    const capply=()=>{cg2.style.display=cfolded?"none":"";
      const f=ch2.querySelector(".fold");if(f)f.textContent=cfolded?"▸":"▾";};
    ch2.title="click to fold/unfold";
    ch2.onclick=()=>{cfolded=!cfolded;try{localStorage.setItem(ckey,cfolded?"1":"0")}catch(e){}capply();};
    capply();
    const addbtn=document.getElementById("addbtn"),cform=document.getElementById("customform");
    if(s.edit_enabled){
      addbtn.style.display="";
      const cfs=document.getElementById("cf-scheme"),cfd=document.getElementById("cf-domain");
      if(!cfd.options.length)(sDomains||[]).forEach(d=>{
        const o=document.createElement("option");o.value=d;o.textContent="."+d;cfd.appendChild(o);});
      addbtn.onclick=(ev)=>{
        ev.stopPropagation();
        cform.style.display=cform.style.display==="none"?"flex":"none";
        if(cform.style.display==="flex")document.getElementById("cf-name").focus();
      };
      document.getElementById("cf-cancel").onclick=(ev)=>{ev.stopPropagation();cform.style.display="none";};
      document.getElementById("cf-add").onclick=async(ev)=>{
        ev.stopPropagation();
        const btn=document.getElementById("cf-add");
        if(btn.disabled)return;
        const payload={
          name:document.getElementById("cf-name").value.trim(),
          ip:document.getElementById("cf-ip").value.trim(),
          port:parseInt(document.getElementById("cf-port").value,10),
          scheme:cfs.value, domain:cfd.value};
        if(!payload.name||!payload.ip||!payload.port){btn.textContent="fill all fields";setTimeout(()=>btn.textContent="add",1600);return}
        btn.disabled=true;btn.textContent="adding…";
        const res=await fetch("/api/custom",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify(payload)});
        btn.disabled=false;btn.textContent="add";
        if(!res.ok){const j=await res.json().catch(()=>({}));btn.textContent=j.error||"error";setTimeout(()=>btn.textContent="add",2400);return}
        const j=await res.json().catch(()=>({}));
        cform.style.display="none";
        ["cf-name","cf-ip","cf-port"].forEach(id=>document.getElementById(id).value="");
        await waitSync(rs=>!!rs.find(v=>v.kind==="custom"&&v.hostname===j.hostname));
        load();
      };
    }
  }catch(e){document.getElementById("grid").innerHTML='<div class="empty">failed to load: '+esc(e)+'</div>'}
}
load();setInterval(()=>{if(EDITING)return;load()},30000);
</script>
</body>
</html>
