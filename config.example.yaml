# traefik-proxmenux-provider configuration
#
# Install as /etc/traefik-proxmenux/config.yaml (owner root, chmod 0600).
# REQUIRED inputs are only:  domain.base   (+ tls.email unless tls.mode=internal)
# Everything else has safe defaults. This file must never contain secrets:
# the API token lives in its own 0600 file referenced by proxmenux.token_file.
# Every key below is listed; unknown keys are rejected (strict parsing).

provider:
  poll_interval: 30s          # how often to re-sync routes (min 10s, enforced)
  log_level: info             # debug | info | warn | error

proxmenux:
  api_url: http://192.0.2.10:8008   # ProxMenux monitor API on the PVE host
  # token_file: /etc/traefik-proxmenux/token  # Bearer token, chmod 0600.
  #   If-and-only-if contract: the provider probes the monitor at startup.
  #   It sends the token only when the monitor actually requires auth, and
  #   it refuses to publish routes unauthenticated when auth is on. Set
  #   this when ProxMenux monitor auth is enabled; leave unset when not.
  timeout: 10s                # per-request timeout
  max_response_bytes: 5242880 # response size cap (5 MiB)
  bridge: vmbr0               # PVE host adapter whose network guest IPs are
                              # matched against. From a guest on that bridge
                              # the default gateway IS the host address on the
                              # adapter — that subnet wins for multi-NIC guests.
  # lan_cidr: 192.0.2.0/24    # explicit override for the subnet above. When
                              # unset it is auto-resolved in order:
                              #   1. the bridge adapter's network (gateway)
                              #   2. the PVE host's /24 from api_url
                              #   3. the provider's own /24
                              # Guests whose IPs all live elsewhere (gluetun/
                              # VPN sidecars, isolated bridges) are never
                              # published — they show stale "no ip available".

domain:
  base: home.example.com      # REQUIRED: every app becomes <slug>.base
                              # this is also the DEFAULT domain
  # alternates:               # extra domains pickable per app in the
  #   - alt.example.com       # dashboard edit dialog (first = default)
  slug_source: watch          # watch    = app name ("AdGuard Home" -> adguard-home)
                              # hostname = LXC/VM hostname
  # slug_overrides:           # static slug fixes applied before the dashboard's
  #   "AdGuard Home": dns     # runtime overrides.json (keyed by app name)
  # include_vmid_suffix: false  # true -> adguard-home-100 (collision-proof slugs)

tls:
  mode: internal              # internal | per-app | wildcard
                              # internal: Traefik default (self-signed) CA —
                              #           LAN-only, zero external dependencies
                              # per-app:  ACME (TLS-ALPN) per hostname — needs
                              #           public TCP 443 straight to Traefik
                              # wildcard: DNS-01 *.base — best for CF-proxied
                              #           zones; requires dns_provider
  # email: you@example.com    # REQUIRED unless mode=internal (ACME account)
  cert_resolver: letsencrypt  # Traefik certResolvers entry for ACME modes
  # dns_provider: cloudflare  # wildcard mode only (lego provider name)
  # dns_credentials_file: /etc/traefik-proxmenux/dns.env  # 0600, provider creds

routing:
  default_enabled: true       # apps are served unless toggled off in the dashboard.
                              # false = opt-in: every app starts disabled (grayed card)
                              # until enabled one by one from the dashboard.
  entrypoint: websecure       # entryPoint receiving generated routers
  # middlewares: []           # extra middlewares on every router,
                              # e.g. [secure-headers@file] or [crowdsec@file]
  probe: true                 # TCP/TLS-check ip:port before publishing a route —
                              # skips dead or drifted apps instead of exposing
                              # them. HTTPS targets are probed with certificate
                              # verification ON; self-signed/untrusted certs are
                              # served via a shared insecure transport.
  probe_timeout: 1.2s
  health_check: false         # add Traefik health checks from web_path/health_path

expose:
  # allow: []                 # slugs to expose; empty = all discovered apps
  # deny: []                  # slugs never exposed (wins over allow)
  dashboard:                  # publishing the PROVIDER UI itself through Traefik
    enabled: false            # fail-closed: without allow_cidrs no route is
    # allow_cidrs: ["192.0.2.0/24"]   # generated at all
    # hostname: provider      # subdomain under domain.base

dashboard:
  enabled: true               # built-in status UI (ProxDnx-style):
                              # every generated URL per container, probe
                              # results, skip reasons, sync times.
                              # JSON endpoint: GET /api/routes
  listen: ":8082"             # bind addr; "127.0.0.1:8082" = localhost only
  via_traefik: false          # also publish https://provider.<base> through
                              # Traefik (same generated TLS) with CIDR
                              # allowlist — recommended access path
  hostname: provider          # subdomain when via_traefik: true
  # allow_cidrs: ["192.0.2.0/24"]   # required for any Traefik-published route
  edit: true                  # double-click a URL to rename it (persists to
                              # overrides.json next to the config)

infra:
  enabled: true               # static entries on the provider domain
                              # (ProxDnx parity): <host>.<domain> -> Proxmox UI
                              # :8006 and menux.<domain> -> ProxMenux UI :8008.
                              # Editable + toggleable like apps (keys
                              # infra:<default-slug>).

output:
  file: /etc/traefik/conf.d/proxmenux-generated.yaml
  mode: "0644"
  backup: true                # keep a .bak of the output before each change
