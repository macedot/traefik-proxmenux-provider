name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: vet
        run: go vet ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: test (race + coverage)
        run: go test -race -coverprofile=coverage.out -timeout 300s ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gosec
        uses: securego/gosec@v2.30.0
        with:
          args: ./...
